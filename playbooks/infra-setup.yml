- name: Infrastructure Setup
  hosts: all
  remote_user: root

  tasks:

    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install timeshift
      apt:
        name: timeshift
        state: present

    - name: Create timeshift config directory
      ansible.builtin.file:
        path: /etc/timeshift
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Get root device UUID
      ansible.builtin.shell:
        cmd: set -o pipefail && blkid -s UUID -o value "$(df --output=source / | tail -1)"
        executable: /bin/bash
      register: root_uuid
      changed_when: false
      # An empty UUID would be written into timeshift.json unnoticed and the
      # nightly snapshot cron would then fail silently every night.
      failed_when: root_uuid.rc != 0 or (root_uuid.stdout | trim | length == 0)

    - name: Configure timeshift
      ansible.builtin.copy:
        dest: /etc/timeshift/timeshift.json
        owner: root
        group: root
        mode: '0600'
        content: |
          {
            "backup_device_uuid" : "{{ root_uuid.stdout }}",
            "do_first_run" : "false",
            "btrfs_mode" : "false",
            "stop_cron_emails" : "true",
            "schedule_monthly" : "false",
            "schedule_weekly" : "false",
            "schedule_daily" : "false",
            "schedule_hourly" : "false",
            "schedule_boot" : "false",
            "schedule_monthly_count" : "2",
            "schedule_weekly_count" : "3",
            "schedule_daily_count" : "3",
            "schedule_hourly_count" : "6",
            "schedule_boot_count" : "5",
            "exclude" : [],
            "exclude-apps" : []
          }

    - name: Schedule daily timeshift snapshot at 03:00
      ansible.builtin.cron:
        name: timeshift-daily
        hour: "3"
        minute: "0"
        job: "/usr/bin/timeshift --create --comments 'Daily snapshot' --tags D >> /var/log/timeshift-cron.log 2>&1"
        user: root

    - name: Disable swap
      ansible.builtin.shell: swapoff -a
      changed_when: false

    # Match on the fstype field rather than " swap " anywhere in the line.
    # Ubuntu's installer (curtin) writes the entry tab-separated
    # ("/swap.img\tnone\tswap\tsw\t0\t0"), so a literal " swap " never matched
    # and swap silently came back on the next reboot; matching the field also
    # avoids commenting out an unrelated entry mounted at e.g. /mnt/swap.
    #
    # The leading (?!\s*#) is what allows \s* inside the capture: without it an
    # indented entry did not match at all, and with a plain [^#] an indented
    # comment matched and got commented a second time.
    #
    # Keep this in step with the identical task in playbook.yml.
    - name: Comment out swap entries in fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(?!\s*#)(\s*\S+\s+\S+\s+swap\s+.*)$'
        replace: '# \1'

    - name: Disable and stop ufw
      ansible.builtin.systemd:
        name: ufw
        state: stopped
        enabled: false

    - name: Disable and stop apparmor
      ansible.builtin.systemd:
        name: apparmor
        state: stopped
        enabled: false

    - name: Enable IPv4 forwarding for Kubernetes
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        sysctl_file: /etc/sysctl.d/99-kubernetes-cri.conf
        state: present
        reload: true
