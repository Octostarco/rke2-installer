- name: RKE2 Teardown
  hosts: all
  remote_user: root

  tasks:

    # `removes:` skips the task when RKE2 was never installed, which is the only
    # case the previous `ignore_errors: true` was meant to cover. Keeping
    # ignore_errors would also have swallowed a genuine failure (e.g. killall
    # ran but could not stop containerd), leaving the box half torn down while
    # the play happily rebooted it.
    - name: Run rke2-killall.sh
      ansible.builtin.shell: /usr/local/bin/rke2-killall.sh
      args:
        removes: /usr/local/bin/rke2-killall.sh
      register: rke2_killall

    - name: Run rke2-uninstall.sh
      ansible.builtin.shell: /usr/local/bin/rke2-uninstall.sh
      args:
        removes: /usr/local/bin/rke2-uninstall.sh
      register: rke2_uninstall

    - name: Remove remaining directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/rancher
        - /var/lib/rancher
        - /var/lib/kubelet
        - /run/k3s
        - /etc/cni
        - /opt/cni
        - /var/log/pods
        - /var/log/containers

    - name: Remove Cilium network interfaces
      ansible.builtin.shell: |
        for iface in cilium_vxlan cilium_net cilium_host lxc_health; do
          ip link delete $iface 2>/dev/null || true
        done
      changed_when: false

    # Don't bounce a host that never had RKE2 on it in the first place.
    - name: Reboot to clear residual network state
      when: not (rke2_killall.skipped | default(false) and rke2_uninstall.skipped | default(false))
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible after RKE2 teardown"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: uptime
