- name: Setup vLLM and dependencies
  hosts: "{{ target_host }}"
  gather_facts: true
  become: true
  vars:
    # Escape hatch for the reservation-flag check further down; see the comment
    # on "Fail when the running k3s unit would shadow the reservations drop-in".
    octobox_allow_stale_kubelet_flags: false

    # This play was written for the bare-metal octoboxes. On EC2 two of its
    # assumptions are wrong and one is actively harmful, so the affected tasks
    # are gated on this. Autodetected from the SMBIOS vendor; override with
    # -e octobox_is_ec2=true/false. Always compare with `| bool`: that override
    # arrives as the bare string "false", which is truthy to Jinja, so a plain
    # `when: octobox_is_ec2` would read it as true and do the opposite.
    octobox_is_ec2: "{{ ansible_facts['system_vendor'] | default('') == 'Amazon EC2' }}"

    # k3s advertises a fixed dummy0 address on bare metal so it is not confused
    # when ethernet cards are switched. On EC2 the primary ENI IP is already
    # stable across stop/start, so that problem does not exist - and 172.31.255.1
    # sits inside the default VPC CIDR 172.31.0.0/16, where it can collide with a
    # real instance address.
    octobox_dummy0_ip: 172.31.255.1
    k3s_advertise_address: >-
      {{ ansible_default_ipv4.address if (octobox_is_ec2 | bool) else octobox_dummy0_ip }}
  tasks:
  - name: Get nvidia_keyring fact
    ansible.builtin.stat:
      path: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
    register: nvidia_keyring
  - name: Get nvidia repo list
    ansible.builtin.stat:
      path: /etc/apt/sources.list.d/nvidia-container-toolkit.list
    register: nvidia_repo_list
  - name: Populate service facts
    ansible.builtin.service_facts:

  - name: Remove unattended-upgrades
    ansible.builtin.apt:
      name: unattended-upgrades
      state: absent

  # network-manager is only here to create dummy0. Installing it on EC2 Ubuntu
  # means NetworkManager takes over interfaces that netplan is managing, which
  # is exactly the ENI disruption the dummy0 tasks below are skipped to avoid.
  - name: Install pip and nmcli
    ansible.builtin.apt:
      update_cache: yes
      pkg: "{{ ['python3-pip'] + ([] if (octobox_is_ec2 | bool) else ['network-manager']) }}"

  - name: Install pip dependencies for k8s ansible module
    ansible.builtin.pip:
      break_system_packages: true
      name:
        - kubernetes
        - pyyaml
        - jsonpatch

  # This one worked
  # - name: Create dummy loopback interface so k3s is not confused when switching ethernet cards
  #   ansible.builtin.shell: nmcli connection add type dummy ifname dummy0 ipv4.addresses 172.31.255.1/32 ipv4.method manual autoconnect yes

  # The whole dummy0 dance is a bare-metal workaround: it gives k3s an address
  # that survives swapping ethernet cards. EC2 does not have that problem (the
  # primary ENI IP is stable across stop/start), and restarting NetworkManager
  # there risks disturbing the netplan-managed ENI config - i.e. dropping the
  # connection this play is running over.
  - name: Enable rule to manage dummy network interface
    when: not (octobox_is_ec2 | bool)
    ansible.builtin.copy:
      dest: "/etc/NetworkManager/conf.d/90-manage-dummy0.conf"
      content: |
        [keyfile]
        unmanaged-devices=interface-name:!*dummy0
    register: nmcli_dummy0_managed

  - name: Restart NetworkManager
    when:
      - not (octobox_is_ec2 | bool)
      - nmcli_dummy0_managed.changed
    ansible.builtin.systemd:
      state: restarted
      name: NetworkManager

  - name: Create dummy loopback interface so k3s is not confused when switching ethernet cards
    when: not (octobox_is_ec2 | bool)
    community.general.nmcli:
      conn_name: dummy0
      ifname: dummy0
      type: dummy
      ip4: "{{ octobox_dummy0_ip }}/32"
      method4: manual
      state: present
      autoconnect: true

  # - name: Check dummy network
  #   ansible.builtin.pause:
  #     prompt: "Check dummy network"

  # TODO: add label '"nvidia.com/gpu.present: "true"' to node, so nvidia device plugin daemonset gets scheduled there

  # Both tasks below build their destination via a pipe/redirect, so they write
  # to a temporary file first and only move it into place once the whole
  # pipeline succeeded. Otherwise a failed download leaves an empty file behind
  # and the `when: not ... .stat.exists` guard skips the task on every later
  # run, permanently stranding the box with a broken keyring/repo list.
  #
  # Note: these commands must stay on a single line. In a folded (>-) scalar a
  # trailing backslash is joined to the next line with a space and becomes an
  # escaped space, which the shell parses as a word of its own rather than a
  # line continuation.
  - name: Fetch nvidia repo gpg key
    when: not nvidia_keyring.stat.exists
    ansible.builtin.shell:
      cmd: set -o pipefail && curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | gpg --dearmor -o /tmp/nvidia-container-toolkit-keyring.gpg && mv /tmp/nvidia-container-toolkit-keyring.gpg /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
      executable: /bin/bash

  - name: Add nvidia repo
    when: not nvidia_repo_list.stat.exists
    ansible.builtin.shell:
      cmd: set -o pipefail && curl -fsSL https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list | sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' > /tmp/nvidia-container-toolkit.list && mv /tmp/nvidia-container-toolkit.list /etc/apt/sources.list.d/nvidia-container-toolkit.list
      executable: /bin/bash

  # https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html#next-steps
  - name: Install nvidia container runtime (toolkit)
    vars:
      nvidia_toolkit_version: 1.17.8-1
    ansible.builtin.apt:
      update_cache: yes
      pkg:
        - nvidia-container-toolkit={{nvidia_toolkit_version }}
        - nvidia-container-toolkit-base={{nvidia_toolkit_version }}
        - libnvidia-container-tools={{nvidia_toolkit_version }}
        - libnvidia-container1={{nvidia_toolkit_version }}

  # Skipped on EC2: the Deep Learning AMI already ships a newer driver (595.71.05
  # at time of writing, running real sm_120 compute), so installing 580 here is a
  # downgrade. cuda-drivers-fabricmanager is for NVSwitch systems, which the
  # g7e instances do not have.
  - name: Install k3s compatible drivers
    when: not (octobox_is_ec2 | bool)
    vars:
      nvidia_driver_version: 580
    ansible.builtin.apt:
      update_cache: yes
      pkg:
        - nvidia-container-runtime
        - cuda-drivers-fabricmanager-{{ nvidia_driver_version }}
        - nvidia-headless-{{ nvidia_driver_version }}-server-open
        - nvidia-utils-{{ nvidia_driver_version }}-server

  # Installing a driver does not reload the running kernel module, so a box that
  # already had an older nvidia driver loaded keeps serving it until a reboot.
  # Nothing above fails in that case: the device plugin and the vLLM pods come up
  # into "Failed to initialize NVML: Driver/library version mismatch" while
  # ansible-playbook exits 0. Surface it here rather than in CrashLoopBackOff.
  - name: Check the nvidia driver is usable
    ansible.builtin.command: nvidia-smi
    register: nvidia_smi
    changed_when: false
    failed_when: false

  - name: Fail when the nvidia driver is not usable
    when: nvidia_smi.rc != 0
    ansible.builtin.fail:
      msg: >-
        nvidia-smi exited {{ nvidia_smi.rc }}:
        {{ (nvidia_smi.stderr | default('', true) or nvidia_smi.stdout | default('', true)) | trim }}
        This host most likely needs a reboot for the installed driver to load.
        GPU workloads applied now would fail with NVML initialisation errors.

  - name: Install k3s
    when: ansible_facts.services['k3s.service']['status'] | default('not-found') == 'not-found'
    # TODO: disable traefik at startup
    ansible.builtin.shell: curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--disable traefik --default-runtime=nvidia --advertise-address {{ k3s_advertise_address | trim }}" sh -
    # ansible.builtin.shell: curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--disable traefik --default-runtime=nvidia" sh -

  # The guard above means an already-provisioned box never gets its unit file
  # rewritten, so boxes installed before ba11344 still carry the reservations
  # that INSTALL_K3S_EXEC used to pass as flags (467c3d9):
  #   --kubelet-arg='system-reserved=cpu=6,memory=26Gi'
  #   --kubelet-arg='kube-reserved=cpu=1,memory=2Gi'
  # Kubelet command-line flags beat the equivalent fields of a
  # KubeletConfiguration drop-in, so on exactly the hosts already in production
  # systemReserved/kubeReserved in 90-k3s-reservations.conf below are shadowed:
  # a later change to those values reports changed, restarts k3s, and has no
  # effect. Precedence is per-field, so maxPods and shutdownGracePeriod - never
  # passed as flags on the octoboxes - do still apply.
  #
  # Stop rather than rewrite the unit: clearing the flags means regenerating
  # ExecStart, which is the installer's job and restarts the cluster, so it
  # should be a deliberate act. Re-run the k3s installer with the current
  # INSTALL_K3S_EXEC to clear them, or set the override to proceed knowingly.
  - name: Check the k3s unit for reservation flags that shadow the drop-in
    when: ansible_facts.services['k3s.service'] is defined
    ansible.builtin.command: grep -c -- "--kubelet-arg=.*-reserved=" /etc/systemd/system/k3s.service
    register: k3s_stale_flags
    changed_when: false
    failed_when: false

  - name: Fail when the running k3s unit would shadow the reservations drop-in
    when:
      - not octobox_allow_stale_kubelet_flags
      - (k3s_stale_flags.stdout | default('0') | int) > 0
    ansible.builtin.fail:
      msg: >-
        /etc/systemd/system/k3s.service still passes system-reserved/kube-reserved
        as --kubelet-arg flags, which override systemReserved/kubeReserved in
        90-k3s-reservations.conf - editing that file would silently do nothing.
        Re-run the k3s installer on this host with the INSTALL_K3S_EXEC from the
        "Install k3s" task above (this restarts k3s), or re-run this play with
        -e octobox_allow_stale_kubelet_flags=true to continue anyway.

  # systemd only honours the kubelet's shutdown inhibitor lock for up to
  # InhibitDelayMaxSec, so shutdownGracePeriod below is capped by this. If the
  # cap is lower, the kubelet silently reports shutdownGracePeriod 0s and pods
  # are still SIGKILLed on reboot - no warning is logged.
  #
  # The zz- prefix is required: logind drop-ins are merged in lexicographic
  # filename order across /etc and /usr/lib, and /etc only wins over /usr/lib
  # for the *same* filename. unattended-upgrades ships
  # /usr/lib/systemd/logind.conf.d/unattended-upgrades-logind-maxdelay.conf
  # with InhibitDelayMaxSec=30, which beats any numeric prefix.
  - name: Ensure systemd-logind drop-in directory exists
    ansible.builtin.file:
      path: /etc/systemd/logind.conf.d
      state: directory
      mode: "0755"

  - name: Allow systemd to hold shutdown long enough for kubelet to drain pods
    ansible.builtin.copy:
      dest: /etc/systemd/logind.conf.d/zz-k3s-inhibit-delay.conf
      content: |
        [Login]
        InhibitDelayMaxSec=120
    register: k3s_inhibit_delay

  - name: Reload systemd-logind so the new inhibit delay applies
    when: k3s_inhibit_delay.changed
    ansible.builtin.systemd:
      state: restarted
      name: systemd-logind

  # k3s only creates this directory once the agent has started, so on a first
  # run the copy below would fail with "Destination directory does not exist".
  - name: Ensure k3s kubelet drop-in directory exists
    ansible.builtin.file:
      path: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d
      state: directory
      mode: "0755"

  - name: Ensure kubelet reservations, pod limit and graceful shutdown for newer k3s versions
    ansible.builtin.copy:
      dest: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/90-k3s-reservations.conf
      content: |
        apiVersion: kubelet.config.k8s.io/v1beta1
        kind: KubeletConfiguration
        systemReserved:
          cpu: "6"
          memory: "26Gi"
        kubeReserved:
          cpu: "1"
          memory: "2Gi"
        # TEAM-7147: the rke2/k3s default of ~110 is not enough during the
        # NiFi -> Temporal pipeline transition, when both stacks run together.
        maxPods: 200
        # k3s ships shutdownGracePeriod: 0s in 00-k3s-defaults.conf, so pods are
        # SIGKILLed on reboot. That corrupted redis' AOF and left dangling XA
        # transactions in mysql on octobox01. Give stateful pods time to flush.
        shutdownGracePeriod: 90s
        shutdownGracePeriodCriticalPods: 30s
    register: k3s_reservations

  # The inhibit-delay drop-in has to be in this condition too. The kubelet reads
  # CurrentInhibitDelay from logind once, at start, so on a box provisioned by
  # ba11344 - where only the logind file changes on a re-run - restarting logind
  # alone never reaches the running kubelet and graceful shutdown stays off. The
  # next reboot then still SIGKILLs pods with no drain, which is the whole
  # failure this pair of drop-ins exists to prevent.
  - name: Restart k3s service
    when: k3s_reservations.changed or k3s_inhibit_delay.changed
    ansible.builtin.systemd:
      state: restarted
      name: k3s
    register: k3s_restarted

  # Everything below talks to the apiserver. Both the restart above and the
  # get.k3s.io installer return before it is accepting connections, so without
  # this the helm and k8s tasks race it and fail with connection refused or 401.
  - name: Wait for the k3s apiserver to accept connections
    ansible.builtin.wait_for:
      host: 127.0.0.1
      port: 6443
      timeout: 300

  - name: Wait for the k3s apiserver to report ready
    ansible.builtin.command: k3s kubectl get --raw /readyz
    register: k3s_readyz
    until: k3s_readyz.rc == 0
    retries: 30
    delay: 5
    changed_when: false

  - name: Ensure helm is installed
    block:
      - name: Check if helm is installed
        ansible.builtin.shell: helm --help
        changed_when: false
    rescue:
      # Block scalar (|), not folded (>-): a folded scalar turns the trailing
      # backslashes into escaped spaces, so curl was handed a bogus extra URL
      # argument, exited 3, and helm never actually got installed.
      - name: Install helm
        ansible.builtin.shell: |
          set -euo pipefail
          curl -fsSL -o /tmp/get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 /tmp/get_helm.sh
          /tmp/get_helm.sh
        args:
          executable: /bin/bash

  - name: Ensure /root/.kube exists
    ansible.builtin.file:
      path: /root/.kube
      state: directory

  - name: Copy kubeconfig file so helm can see it (embedded kubectl looks at /etc/rancher/k3s/k3s.yaml)
    ansible.builtin.copy:
      remote_src: true
      src: /etc/rancher/k3s/k3s.yaml
      dest: /root/.kube/config

  - name: Enable nvidia helm repository
    kubernetes.core.helm_repository:
      name: nvdp
      repo_url: https://nvidia.github.io/k8s-device-plugin
  
  # - name: Install k8s-device-plugin helmchart
  #   ansible.builtin.shell: >-
  #     helm upgrade -i nvdp nvdp/nvidia-device-plugin \
  #       --namespace nvidia-device-plugin \
  #       --create-namespace \
  #       --version 0.17.1
  #   changed_when: does not exist

  - name: Install k8s-device-plugin helmchart
    kubernetes.core.helm:
      name: nvdp
      chart_ref: nvdp/nvidia-device-plugin
      chart_version: 0.17.1
      create_namespace: true
      release_namespace: nvidia-device-plugin

  - name: Create vllm namespace
    kubernetes.core.k8s:
      name: vllm
      api_version: v1
      kind: Namespace
      state: present

  # qwen36 asks for 0.55 of the GPU and qwen35 for 0.50, so on a box that
  # already runs qwen35 the new pod cannot fit until the old one is gone.
  # The PVCs are deliberately left behind - dropping them would throw away the
  # downloaded weights.
  #
  # Foreground propagation + wait is what makes this correct: without it the
  # module returns as soon as the API server accepts the delete, qwen36 is
  # applied while the old vLLM process still holds its share of the GPU, and
  # the new pod CUDA-OOMs into CrashLoopBackOff - exactly the contention this
  # task exists to avoid. Foreground keeps the Deployment object around until
  # its ReplicaSets and Pods are actually gone.
  - name: Remove retired vLLM deployments
    kubernetes.core.k8s:
      state: absent
      api_version: apps/v1
      kind: Deployment
      namespace: vllm
      name: "{{ item }}"
      wait: true
      wait_timeout: 300
      delete_options:
        propagationPolicy: Foreground
    loop:
      - qwen3
      - qwen35
      - phi35

  - name: Remove retired vLLM services
    kubernetes.core.k8s:
      state: absent
      api_version: v1
      kind: Service
      namespace: vllm
      name: "{{ item }}"
    loop:
      - qwen3
      - qwen35
      - phi35

  - name: Copy deployments files
    ansible.builtin.copy:
      # remote_src: true
      src: deployments/{{ item }}-deployment.yml
      dest: /root/{{ item }}-deployment.yml
    loop:
      - qwen36

  - name: Apply k8s deployments
    kubernetes.core.k8s:
      state: present
      src: /root/{{ item }}-deployment.yml
    loop:
      - qwen36

  # In case you mess things up with the operator, refer to this: https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/latest/uninstall.html
