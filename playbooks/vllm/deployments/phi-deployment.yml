apiVersion: apps/v1
kind: Deployment
metadata:
  name: phi35
  namespace: vllm
  labels:
    app: phi35
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phi35
  strategy:
    # Strategy is set to recreate so the old vLLM pod is killed before the new one starts
    # otherwise, some GPU contention problems arise that cause the new pod to keep crashing before the old pod is killed
    type: Recreate
  template:
    metadata:
      labels:
        app: phi35
    spec:
      volumes:
      - name: cache-volume
        # hostPath:
        #   path: /model-cache
        persistentVolumeClaim:
          claimName: phi35-pvc
        # persistentVolumeClaim:
        #   claimName: phi35
      # vLLM needs to access the host's shared memory for tensor parallel inference.
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: "16Gi"
      initContainers:
      - name: ensure-model-download
        image: vllm/vllm-openai:v0.10.2
        command: ["/bin/sh", "-c"]
        args: ["stat /root/.cache/huggingface/phi35 || python3 -c 'from huggingface_hub import snapshot_download; snapshot_download(repo_id=\"microsoft/Phi-3.5-vision-instruct\", local_dir=\"/root/.cache/huggingface/phi35\")'"]
        volumeMounts:
        - mountPath: /root/.cache/huggingface
          name: cache-volume
        # args: [
        #   ""
        #   "python3",
        #   "-c",
        #   "from huggingface_hub import snapshot_download; snapshot_download(repo_id='microsoft/Phi-3.5-vision-instruct', local_dir='/root/.cache/huggingface/phi35')"
        # ]
      containers:
      - name: phi35
        # image: vllm/vllm-openai:v0.10.1.1
        image: vllm/vllm-openai:v0.10.2
        command: ["/bin/sh", "-c"]
        # args: [
        #   "vllm serve Qwen/phi35-0.6B --tensor-parallel-size 2 --host 0.0.0.0 --port 8000 --download-dir /root/.cache/huggingface --generation-config vllm --gpu-memory-utilization 0.95 --swap-space 16 --kv-cache-dtype auto --max-model-len 16000 --max-num-batched-tokens 16000 --max-num-seqs 8 --served-model-name phi35-0.6b"
        # ]
        # args: [
        #   "vllm serve Qwen/phi35-Omni-30B-A3B-Instruct --tensor-parallel-size 2 --host 0.0.0.0 --port 8000 --download-dir /root/.cache/huggingface --generation-config vllm --gpu-memory-utilization 0.95 --swap-space 16 --kv-cache-dtype auto --max-model-len 16000 --max-num-batched-tokens 16000 --max-num-seqs 8 --served-model-name phi35-30b"
        # ]
        # args: [
        #   "vllm serve microsoft/Phi-3.5-vision-instruct --tensor-parallel-size 2 --trust-remote-code --host 0.0.0.0 --port 8000 --max-model-len 4096 --dtype bfloat16 --gpu-memory-utilization 0.15 --limit-mm-per-prompt '{\"image\":1}' --served-model-name phi35"
        # ]
        # args: [
        #   "vllm serve mlx-community/Phi-3.5-vision-instruct-4bit --tensor-parallel-size 2 --trust-remote-code --host 0.0.0.0 --port 8000 --max-model-len 4096 --dtype bfloat16 --gpu-memory-utilization 0.15 --limit-mm-per-prompt '{\"image\":1}' --served-model-name phi35"
        # ]
        # args: [
        #   "vllm serve Isotr0py/Phi-3.5-vision-instruct-AWQ --tensor-parallel-size 2 --trust-remote-code --host 0.0.0.0 --port 8000 --max-model-len 4096 --dtype bfloat16 --gpu-memory-utilization 0.15 --limit-mm-per-prompt '{\"image\":1}' --served-model-name phi35"
        # ]
        args: [
          "vllm serve /root/.cache/huggingface/phi35 --tensor-parallel-size 2 --enable-prefix-caching --trust-remote-code --host 0.0.0.0 --port 8000 --max-model-len 4096 --dtype auto --gpu-memory-utilization 0.10 --limit-mm-per-prompt '{\"image\":2}' --served-model-name phi35"
        ]
        # args: ["sleep inf"]
        env:
          - name: HF_HUB_OFFLINE
            value: "1"
        # Isotr0py/Phi-3.5-vision-instruct-AWQ --quantization awq
        # env:
        # - name: HUGGING_FACE_HUB_TOKEN
        #   valueFrom:
        #     secretKeyRef:
        #       name: hf-token-secret
        #       key: token
        ports:
        - containerPort: 8000
        resources:
          # limits:
          #   cpu: "10"
          #   memory: 20G
            # nvidia.com/gpu: "1"
          requests:
            cpu: "2"
            memory: 6G
            # nvidia.com/gpu: "1"
        volumeMounts:
        - mountPath: /root/.cache/huggingface
          name: cache-volume
        - name: shm
          mountPath: /dev/shm
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 3600
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 5

---

apiVersion: v1
kind: Service
metadata:
  name: phi35
  namespace: vllm
spec:
  ports:
  - name: http-phi35
    port: 80
    protocol: TCP
    targetPort: 8000
  # The label selector should match the deployment labels & it is useful for prefix caching feature
  selector:
    app: phi35
  sessionAffinity: None
  type: ClusterIP


# uv run openai-llm-benchmark.py --base-url http://phi35.vllm.svc.cluster.local --model phi35 --requests 200 --concurrency 128

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: phi35-pvc
  namespace: vllm
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path