apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3
  namespace: vllm
  labels:
    app: qwen3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen3
  strategy:
    # Strategy is set to recreate so the old vLLM pod is killed before the new one starts
    # otherwise, some GPU contention problems arise that cause the new pod to keep crashing before the old pod is killed
    type: Recreate
  template:
    metadata:
      labels:
        app: qwen3
    spec:
      volumes:
      - name: cache-volume
        persistentVolumeClaim:
          claimName: qwen3-pvc
        # hostPath:
        #   path: /model-cache
      # vLLM needs to access the host's shared memory for tensor parallel inference.
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: "16Gi"
      containers:
      - name: qwen3
        # image: vllm/vllm-openai:v0.10.1.1
        image: vllm/vllm-openai:v0.10.2
        command: ["/bin/sh", "-c"]
        # args: [
        #   "vllm serve Qwen/Qwen3-0.6B --tensor-parallel-size 2 --host 0.0.0.0 --port 8000 --download-dir /root/.cache/huggingface --generation-config vllm --gpu-memory-utilization 0.95 --swap-space 16 --kv-cache-dtype auto --max-model-len 16000 --max-num-batched-tokens 16000 --max-num-seqs 8 --served-model-name qwen3-0.6b"
        # ]
        # args: [
        #   "vllm serve Qwen/Qwen3-Omni-30B-A3B-Instruct --tensor-parallel-size 2 --host 0.0.0.0 --port 8000 --download-dir /root/.cache/huggingface --generation-config vllm --gpu-memory-utilization 0.95 --swap-space 16 --kv-cache-dtype auto --max-model-len 16000 --max-num-batched-tokens 16000 --max-num-seqs 8 --served-model-name qwen3-30b"
        # ]
        # args: [
        #   "vllm serve Qwen/Qwen3-30B-A3B-FP8 --enable-auto-tool-choice --tool-call-parser hermes --reasoning-parser deepseek_r1 --tensor-parallel-size 2 --host 0.0.0.0 --port 8000 --download-dir /root/.cache/huggingface --generation-config vllm --gpu-memory-utilization 0.5 --swap-space 16 --kv-cache-dtype auto --max-model-len 32000 --max-num-batched-tokens 32000 --max-num-seqs 8 --served-model-name qwen3-30b"
        # ]
        # args: [
        #   "vllm serve Qwen/Qwen3-30B-A3B-FP8 --quantization fp8 --reasoning-parser deepseek_r1 --host 0.0.0.0 --port 8000 --download-dir /root/.cache/huggingface --generation-config vllm --gpu-memory-utilization 0.50 --swap-space 16 --kv-cache-dtype auto --tensor-parallel-size 2 --max-model-len 32000 --max-num-batched-tokens 32000 --max-num-seqs 4 --served-model-name qwen3-30b --enable-auto-tool-choice --tool-call-parser hermes"
        # ]
        args: [
          "vllm serve nvidia/Qwen3-30B-A3B-FP4 --quantization fp4 --reasoning-parser deepseek_r1 --host 0.0.0.0 --port 8000 --download-dir /root/.cache/huggingface --generation-config vllm --gpu-memory-utilization 0.50 --swap-space 16 --kv-cache-dtype auto --tensor-parallel-size 2 --max-model-len 32000 --max-num-batched-tokens 32000 --max-num-seqs 4 --served-model-name qwen3-30b --enable-auto-tool-choice --tool-call-parser hermes"
        ]
        
        env:
          - name: HF_HUB_OFFLINE
            value: "1"
        # env:
        #- name: CUDA_VISIBLE_DEVICES                                                    
        #  value: "1"
        # - name: HUGGING_FACE_HUB_TOKEN
        #   valueFrom:
        #     secretKeyRef:
        #       name: hf-token-secret
        #       key: token
        ports:
        - containerPort: 8000
        resources:
          # limits:
          #   cpu: "10"
          #   memory: 20G
            # nvidia.com/gpu: "1"
          requests:
            cpu: "2"
            memory: 6G
            # nvidia.com/gpu: "1"
        volumeMounts:
        - mountPath: /root/.cache/huggingface
          name: cache-volume
        - name: shm
          mountPath: /dev/shm
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 3600
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 5

---

apiVersion: v1
kind: Service
metadata:
  name: qwen3
  namespace: vllm
spec:
  ports:
  - name: http-qwen3
    port: 80
    protocol: TCP
    targetPort: 8000
  # The label selector should match the deployment labels & it is useful for prefix caching feature
  selector:
    app: qwen3
  sessionAffinity: None
  type: ClusterIP


# uv run openai-llm-benchmark.py --base-url http://qwen3.vllm.svc.cluster.local --model qwen3-30b --requests 200 --concurrency 4

