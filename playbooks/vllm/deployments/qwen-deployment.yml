apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen3-pvc
  namespace: vllm
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: local-path