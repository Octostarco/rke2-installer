apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen35
  namespace: vllm
  labels:
    app: qwen35
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen35
  strategy:
    # Strategy is set to recreate so the old vLLM pod is killed before the new one starts
    # otherwise, some GPU contention problems arise that cause the new pod to keep crashing before the old pod is killed
    type: Recreate
  template:
    metadata:
      labels:
        app: qwen35
    spec:
      volumes:
      - name: cache-volume
        persistentVolumeClaim:
          claimName: qwen35-pvc
        # hostPath:
        #   path: /model-cache
      # vLLM needs to access the host's shared memory for tensor parallel inference.
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: "16Gi"
      initContainers:
      - name: ensure-model-download
        image: vllm/vllm-openai:v0.18.0
        command: ["/bin/sh", "-c"]
        args: ["stat /root/.cache/huggingface/qwen35 || python3 -c 'from huggingface_hub import snapshot_download; snapshot_download(repo_id=\"Qwen/Qwen3.5-35B-A3B-FP8\", local_dir=\"/root/.cache/huggingface/qwen35\")'"]
        volumeMounts:
        - mountPath: /root/.cache/huggingface
          name: cache-volume
      containers:
      - name: qwen3
        image: vllm/vllm-openai:v0.18.0
        command: ["/bin/sh", "-c"]
        args: [
          "vllm serve /root/.cache/huggingface/qwen35 --host 0.0.0.0 --port 8000 --download-dir /root/.cache/huggingface --gpu-memory-utilization 0.50 --dtype auto --reasoning-parser qwen3 --tensor-parallel-size 2 --max-model-len 70000 --enable-chunked-prefill --max-num-batched-tokens 8192 --max-num-seqs 16 --served-model-name qwen35 --tool-call-parser hermes --enable-auto-tool-choice --chat-template-content-format openai --kv-cache-dtype fp8"
        ]
        env:
          - name: HF_HUB_OFFLINE
            value: "1"
        # env:
        #- name: CUDA_VISIBLE_DEVICES                                                    
        #  value: "1"
        # - name: HUGGING_FACE_HUB_TOKEN
        #   valueFrom:
        #     secretKeyRef:
        #       name: hf-token-secret
        #       key: token
        ports:
        - containerPort: 8000
        resources:
          # limits:
          #   cpu: "10"
          #   memory: 20G
            # nvidia.com/gpu: "1"
          requests:
            cpu: "2"
            memory: 6G
            # nvidia.com/gpu: "1"
        volumeMounts:
        - mountPath: /root/.cache/huggingface
          name: cache-volume
        - name: shm
          mountPath: /dev/shm
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 3600
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 5

---

apiVersion: v1
kind: Service
metadata:
  name: qwen35
  namespace: vllm
spec:
  ports:
  - name: http-qwen35
    port: 80
    protocol: TCP
    targetPort: 8000
  # The label selector should match the deployment labels & it is useful for prefix caching feature
  selector:
    app: qwen35
  sessionAffinity: None
  type: ClusterIP

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen35-pvc
  namespace: vllm
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: local-path
